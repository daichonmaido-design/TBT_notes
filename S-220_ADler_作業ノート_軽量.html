## P.5 桁加工練習（アングル・手順1〜2）

次にアングルと呼ばれるL字型の金属です。

> [図解] 【図：アングルと治具・聖地】
> ・この2面にセブンを貼ります。
> ・治具 / アングル / 聖地：こんな風にします。
> ・この3本の線を聖地の線に合わせて貼ってください。
> ・φ60の桁 / 治具 / 60°：この緑色の桁をみなさんに作ってもらいます。

##### 桁加工手順

1. jointを作ります。これは各々でやってください。自分で作ったやつを使って桁を削ってみるといいです。
2. 桁に中心線を引きます。長いアングルがあるので図のようにしてください。

> [図解] 【図：桁とアングル】ラベル：桁 / アングル / 線 / 当ててない方 / アングルを当てた方
> アングルを桁にあてて、アングルに沿ってポスカで引くと桁の軸に平行な線が引けます。その後、アングルを当てた方の縁がどちらか分かるようにしてください。左下の図のように矢印とか書いておいてください。

## P.6 桁加工手順 3〜6

3. ウラにセブンを貼ったjointを中心線に合わせて桁に貼ります。
このとき、中心線のどちら側に合わせるかを間違えないようにしてください。

片方の端を桁加工するときはjointのどこの線を合わせてもいいんですが、桁加工されている桁のもう片方の端をやるときは ねじれ に注意してください。

4. jointの線を参考にし、削っていきます。（グラインダーで攻めると楽）
jointの線ピッタリに合わせても上手くいきません。
ある程度まで来たら feeling の世界に突入します。

5. 2本の桁を聖地の治具上で合わせ、すき間があるかどうかをみます。
基準は“セブンの剥離紙が入らない”です。自分でやってみるといいと思います。

6. 上手くできたと思ったらLINEでもいいので呼んでください。

> [図解] 【図：桁の合わせ方】
> ・合わせるのはココが一番良いと思います。
> ・アングルあてた側と合わせる!!

## P.19 2/11 (7日目) 〜 2/13 (9日目) ＆材力メモ

> [図解] 【材料力学メモ】
> d²v/dx² = Mb / EIz,  H = 2πnT / 60,  Iz = πd⁴ / 64,  δ = PL / AE,  ε = δ / L,  σ = P / E
> 不静定？ 適合条件  材力？材力？材力？ / 右端縦書き：材力不安勢を追いこむ。
> （両端固定＋等分布荷重w₀の梁図解）
> つり合い：RA + RB - w₀L = 0 / モーメント：MA + RBL - (1/2)w₀L² = 0
> 仮断面：Mb = RAx - MA - (1/2)w₀x²
> EIz v = (1/6)RAx³ - (1/2)MAx² - (1/24)w₀x⁴ + C₁x + C₂
> 境界条件：dv/dx|_{x=0}=0, v|_{x=0}=0, v|_{x=L}=0
> よって C₁=C₂=0, RA = (5/8)w₀L, RB = (3/8)w₀L, MA = (1/8)w₀L²

    function parseNotebookMarkdown(md) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      const pages = [];
      let currentPage = null;
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        const pageMatch = line.match(/^##\s+P\.(\d+)\s*(.*)$/);
        if (pageMatch) {
          currentPage = {
            page: Number(pageMatch[1]),
            title: pageMatch[2].trim(),
            blocks: []
          };
          pages.push(currentPage);
          i++;
          continue;
        }

        if (!currentPage || line.trim() === '') {
          i++;
          continue;
        }

        // Markdown Table
        if (line.trim().startsWith('|') && i + 1 < lines.length && /^\|\s*[-:]+/.test(lines[i + 1].trim())) {
          const parseRow = (r) => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
          const headers = parseRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith('|')) {
            rows.push(parseRow(lines[i]));
            i++;
          }
          currentPage.blocks.push({ type: 'table', headers, rows });
          continue;
        }

        if (line.startsWith('##### ')) {
          currentPage.blocks.push({ type: 'subheading', text: line.slice(6).trim() });
          i++;
          continue;
        }
        if (line.startsWith('#### ')) {
          currentPage.blocks.push({ type: 'heading', text: line.slice(5).trim() });
          i++;
          continue;
        }
        if (line.startsWith('### ')) {
          currentPage.blocks.push({ type: 'date', text: line.slice(4).trim() });
          i++;
          continue;
        }

        // Quote blocks (reply / diagram / box)
        if (line.startsWith('> ')) {
          const quoteLines = [];
          while (i < lines.length && lines[i].startsWith('>')) {
            quoteLines.push(lines[i].replace(/^>\s?/, ''));
            i++;
          }
          let firstLine = quoteLines[0];
          let btype = 'reply';
          if (firstLine.startsWith('[返信] ')) {
            btype = 'reply';
            firstLine = firstLine.slice(5);
          } else if (firstLine.startsWith('[図解] ')) {
            btype = 'diagram';
            firstLine = firstLine.slice(5);
          } else if (firstLine.startsWith('[枠] ')) {
            btype = 'box';
            firstLine = firstLine.slice(4);
          }
          let author = '';
          const authorMatch = firstLine.match(/^\*\*(.+?)\*\*:\s*(.*)$/);
          if (authorMatch && btype === 'reply') {
            author = authorMatch[1];
            firstLine = authorMatch[2];
          }
          const fullText = [firstLine, ...quoteLines.slice(1)].join('\n').trim();
          currentPage.blocks.push({ type: btype, author, text: fullText });
          continue;
        }

        // Normal paragraph
        const paraLines = [];
        while (i < lines.length && lines[i].trim() !== '' && !lines[i].startsWith('#') && !lines[i].startsWith('> ') && !lines[i].trim().startsWith('|')) {
          paraLines.push(lines[i]);
          i++;
        }
        const joined = paraLines.join('\n').trim();

        const noteMatch = joined.match(/^_([\s\S]+)_$/);
        if (noteMatch) {
          currentPage.blocks.push({ type: 'note', text: noteMatch[1] });
          continue;
        }

        const entryMatch = joined.match(/^\*\*(.+?)\*\*:\s*([\s\S]*)$/);
        if (entryMatch) {
          currentPage.blocks.push({ type: 'entry', author: entryMatch[1], text: entryMatch[2] });
          continue;
        }

        currentPage.blocks.push({ type: 'text', text: joined });
      }
      return pages;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const PAGES = parseNotebookMarkdown(NOTEBOOK_MARKDOWN);

    function populateJumpSelect() {
      const sel = document.getElementById('page-jump');
      PAGES.forEach(p => {
        const opt = document.createElement('option');
        opt.value = `page-${p.page}`;
        opt.textContent = `P.${p.page} ${p.title}`;
        sel.appendChild(opt);
      });
    }

    function renderNotebook(query = '') {
      const container = document.getElementById('pages-container');
      container.innerHTML = '';
      const q = query.trim().toLowerCase();
      let count = 0;

      PAGES.forEach(p => {
        const matchedBlocks = q
          ? p.blocks.filter(b => {
              const hay = ((b.text || '') + ' ' + (b.author || '') + ' ' + p.title + ' ' + (b.rows ? JSON.stringify(b.rows) : '')).toLowerCase();
              return hay.includes(q);
            })
          : p.blocks;

        if (matchedBlocks.length === 0) return;
        count++;

        const section = document.createElement('section');
        section.id = `page-${p.page}`;
        section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden';

        let html = `
          <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
            <span class="px-2 py-0.5 text-xs font-bold bg-slate-800 text-white rounded-md shrink-0">P.${p.page}</span>
            <h2 class="text-sm font-bold text-slate-800 truncate">${escapeHtml(p.title)}</h2>
          </div>
          <div class="p-4 space-y-3">
        `;

        let diagCounter = 0;
        p.blocks.forEach((b, origIdx) => {
          if (b.type === 'diagram') b._diagKey = `${p.page}_${diagCounter++}`;
        });
        matchedBlocks.forEach(b => {
          if (b.type === 'table') {
            html += `
              <div class="overflow-x-auto rounded-lg border border-slate-200">
                <table class="w-full text-xs text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-100 text-slate-700">
                      ${b.headers.map(h => `<th class="p-2 border-b border-r last:border-r-0 border-slate-200 font-semibold">${escapeHtml(h)}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${b.rows.map((row, idx) => `
                      <tr class="${idx % 2 === 1 ? 'bg-slate-50/60' : 'bg-white'}">
                        ${row.map(cell => `<td class="p-2 border-b border-r last:border-r-0 border-slate-200">${escapeHtml(cell)}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
          } else if (b.type === 'heading') {
            html += `<h3 class="text-base font-bold text-slate-900 note-pre">${escapeHtml(b.text)}</h3>`;
          } else if (b.type === 'subheading') {
            html += `<h4 class="text-sm font-bold text-slate-900 bg-slate-100 px-2.5 py-1.5 rounded-lg note-pre">${escapeHtml(b.text)}</h4>`;
          } else if (b.type === 'date') {
            html += `<div class="text-sm font-bold text-blue-700 border-b border-blue-100 pb-1 pt-1 note-pre">${escapeHtml(b.text)}</div>`;
          } else if (b.type === 'reply') {
            const authorBadge = b.author ? `<span class="inline-block font-bold text-xs px-2 py-0.5 rounded bg-sky-200/70 text-sky-900 mr-1.5 mb-1">${escapeHtml(b.author)}</span>` : '';
            html += `<div class="text-sm text-slate-800 bg-sky-50/80 p-3 rounded-xl border border-sky-100 leading-relaxed note-pre">${authorBadge}${escapeHtml(b.text)}</div>`;
          } else if (b.type === 'diagram') {
            const imgSrc = b._diagKey && DIAGRAM_IMAGES[b._diagKey];
            const imgBlock = imgSrc ? `<div class="mt-2.5 flex flex-col items-center"><img src="${imgSrc}" alt="手書き図解" data-zoom-diag="${b._diagKey}" data-zoom-title="P.${p.page} ${escapeHtml(p.title)}" class="max-w-full h-auto max-h-80 rounded-lg border border-slate-200 bg-white cursor-zoom-in shadow-sm" /><span class="text-[10px] text-slate-400 mt-1">タップで図を拡大</span></div>` : '';
            html += `<div class="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-dashed border-slate-300 leading-relaxed"><div class="note-pre">${escapeHtml(b.text)}</div>${imgBlock}</div>`;
          } else if (b.type === 'box') {
            html += `<div class="text-xs sm:text-sm text-slate-700 bg-amber-50/60 p-3 rounded-xl border border-amber-200 leading-relaxed note-pre">${escapeHtml(b.text)}</div>`;
          } else if (b.type === 'note') {
            html += `<p class="text-xs text-slate-500 italic note-pre">${escapeHtml(b.text)}</p>`;
          } else if (b.type === 'entry') {
            html += `<div class="text-sm text-slate-800 leading-relaxed note-pre"><span class="inline-block font-bold text-xs px-2 py-0.5 rounded bg-slate-200 text-slate-800 mr-1.5">${escapeHtml(b.author)}</span>${escapeHtml(b.text)}</div>`;
          } else {
            html += `<p class="text-sm text-slate-800 leading-relaxed note-pre">${escapeHtml(b.text)}</p>`;
          }
        });

        html += `</div>`;
        section.innerHTML = html;
        container.appendChild(section);
      });

      if (count === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-slate-500 text-sm border border-slate-200">該当するページ・記述が見つかりません。</div>`;
      }
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      renderNotebook(e.target.value);
    });

    document.getElementById('page-jump').addEventListener('change', (e) => {
      const id = e.target.value;
      if (!id) return;
      const input = document.getElementById('search-input');
      if (input.value) {
        input.value = '';
        renderNotebook('');
      }
      const el = document.getElementById(id);
      if (el) {
        const y = el.getBoundingClientRect().top + window.scrollY - 108;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
      e.target.value = '';
    });

    const btnTop = document.getElementById('btn-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        btnTop.classList.remove('hidden');
      } else {
        btnTop.classList.add('hidden');
      }
    });
    btnTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('pages-container').addEventListener('click', (e) => {
      const img = e.target.closest('[data-zoom-diag]');
      if (!img) return;
      document.getElementById('modal-title').textContent = img.dataset.zoomTitle || '図解';
      document.getElementById('modal-img').src = DIAGRAM_IMAGES[img.dataset.zoomDiag];
      document.getElementById('img-modal').classList.remove('hidden');
    });

    document.getElementById('btn-modal-close').addEventListener('click', () => {
      document.getElementById('img-modal').classList.add('hidden');
    });

    let exportMode = 'md';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), 2200);
    }

    function generateJavaScriptExport() {
      const escaped = NOTEBOOK_MARKDOWN.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
      return `// S-220 ADler 作業ノート (Markdownデータ・図解画像・パーサー)\nconst NOTEBOOK_MARKDOWN = \`\n${escaped}\`;\n\nconst DIAGRAM_IMAGES = ${JSON.stringify(DIAGRAM_IMAGES)};\n\n${parseNotebookMarkdown.toString()}\n\nconst NOTEBOOK_PAGES = parseNotebookMarkdown(NOTEBOOK_MARKDOWN);\n`;
    }

    function refreshExportPreview() {
      const ta = document.getElementById('export-preview');
      const tabMd = document.getElementById('tab-export-md');
      const tabJs = document.getElementById('tab-export-js');
      if (exportMode === 'js') {
        ta.value = generateJavaScriptExport();
        tabJs.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-900 shadow-sm';
        tabMd.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900';
        document.getElementById('label-copy-btn').textContent = 'JavaScriptコピー';
        document.getElementById('label-dl-btn').textContent = '.js ダウンロード';
      } else {
        ta.value = NOTEBOOK_MARKDOWN;
        tabMd.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white text-slate-900 shadow-sm';
        tabJs.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900';
        document.getElementById('label-copy-btn').textContent = 'Markdownコピー';
        document.getElementById('label-dl-btn').textContent = '.md ダウンロード';
      }
    }

    document.getElementById('btn-export-open').addEventListener('click', () => {
      refreshExportPreview();
      document.getElementById('export-modal').classList.remove('hidden');
    });

    document.getElementById('btn-export-close').addEventListener('click', () => {
      document.getElementById('export-modal').classList.add('hidden');
    });

    document.getElementById('tab-export-md').addEventListener('click', () => {
      exportMode = 'md';
      refreshExportPreview();
    });

    document.getElementById('tab-export-js').addEventListener('click', () => {
      exportMode = 'js';
      refreshExportPreview();
    });

    document.getElementById('btn-copy-code').addEventListener('click', () => {
      const text = document.getElementById('export-preview').value;
      const msg = exportMode === 'js' ? 'JavaScriptをコピーしました' : 'Markdownをコピーしました';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(msg));
      } else {
        fallbackCopy(msg);
      }
    });

    function fallbackCopy(msg) {
      const ta = document.getElementById('export-preview');
      ta.select();
      try {
        document.execCommand('copy');
        showToast(msg);
      } catch (e) {
        showToast('コピーに失敗しました');
      }
    }

    document.getElementById('btn-download-code').addEventListener('click', () => {
      const text = document.getElementById('export-preview').value;
      const isJs = exportMode === 'js';
      const blob = new Blob([text], { type: isJs ? 'application/javascript;charset=utf-8' : 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = isJs ? 'S-220_Adler_notebook.js' : 'S-220_Adler_notebook.md';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(isJs ? 'JavaScriptファイルをダウンロードしました' : 'Markdownファイルをダウンロードしました');
    });

    populateJumpSelect();
    renderNotebook();
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
